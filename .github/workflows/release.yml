name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v1.0.0）；留空则按当前日期自动生成"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release assets
        id: build
        shell: pwsh
        run: |
          "## Marker A reached`n`npwsh $($PSVersionTable.PSVersion)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-ChildItem .\scripts | Select-Object -ExpandProperty Name | Out-String | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $outDir = Join-Path $env:RUNNER_TEMP "release"
          gh release create "$tag" `
            (Join-Path $outDir "HelpToStudy-Vault-$tag.zip") `
            (Join-Path $outDir "HelpToStudy-QuickInstall.bat") `
            --repo "$env:GITHUB_REPOSITORY" `
            --notes-file (Join-Path $outDir "release-notes.md")
