name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v1.0.0）；留空则按当前日期自动生成"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release assets
        id: build
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          "## Build step started`n`npwsh $($PSVersionTable.PSVersion)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          try {
            $tag = $env:TAG_INPUT
            if (-not $tag) {
              if ($env:GITHUB_REF_TYPE -eq "tag") { $tag = $env:GITHUB_REF_NAME }
              else { $tag = "v" + (Get-Date -Format "yyyy.MM.dd") }
            }
            $tag = $tag.Trim()
            if ($tag -notmatch '^v[0-9A-Za-z._-]+$') { throw "Invalid tag: $tag" }
            $outDir = Join-Path $env:RUNNER_TEMP "release"
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            & .\scripts\build-release.ps1 -Tag $tag -Repo $env:GITHUB_REPOSITORY -OutDir $outDir
            Set-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding ascii
            "## Build step SUCCESS tag=$tag" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } catch {
            "## Build step FAILED`n`n- Message: $($_.Exception.Message)`n- Stack: $($_.ScriptStackTrace)`n- Location: $($_.InvocationInfo.PositionMessage)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            throw
          }

      - name: Create GitHub Release
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $outDir = Join-Path $env:RUNNER_TEMP "release"
          gh release create "$tag" `
            (Join-Path $outDir "HelpToStudy-Vault-$tag.zip") `
            (Join-Path $outDir "HelpToStudy-QuickInstall.bat") `
            --repo "$env:GITHUB_REPOSITORY" `
            --notes-file (Join-Path $outDir "release-notes.md")
